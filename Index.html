    "definition": "A jelzők működésük szerint lehetnek: - önműködő jelzők, - félig önműködő jelzők, - nem önműködő jelzők. Az önműködő jelzőkön a jelzések üzemszerűen, emberi beavatkozás nélkül, a közlekedő vonat hatására változnak meg. A félig önműködő jelzőket a jelzők kezelésével megbízott dolgozó állítja továbbhaladást engedélyező állásba, a Megállj! jelzés a közlekedő vonat hatására jelenik meg. A nem önműködő jelzőket a jelző kezelésével megbízott dolgozó állítja továbbhaladást engedélyező és továbbhaladást megtiltó állásba."
  },
  {
    "id": "tetel-50",
    "name": "Távolodj tőlem! – tolatási kézi- és hangjelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászló vagy az egyik kar függőleges irányban fel- és lefelé mozgatása a mozdonyvezető felé. Sötétben fehér fényű kézi jelzőlámpa függőleges irányban fel- és lefelé mozgatása a mozdonyvezető felé. A látható jelzést szükség esetén ki kell egészíteni a jelzősíppal adott egy hosszú hanggal (▬)."
  },
  {
    "id": "tetel-51",
    "name": "Közeledj felém! – tolatási kézi- és hangjelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászló vagy az egyik kar jobbra-balra mozgatása a test előtt vízszintes irányban a mozdonyvezető felé. Sötétben fehér fényű kézi jelzőlámpa jobbra-balra mozgatása a test előtt vízszintes irányban a mozdonyvezető felé. A látható jelzést szükség esetén ki kell egészíteni a jelzősíppal adott egy rövid és egy hosszú hanggal (● ▬)."
  },
  {
    "id": "tetel-52",
    "name": "Lassan! – tolatási kézi- és hangjelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászló vagy az egyik kar ferdén lefelé tartása a mozdonyvezető felé. Sötétben fehér fényű kézi jelzőlámpa ferdén lefelé tartása a mozdonyvezető felé. A látható jelzést szükség esetén ki kell egészíteni a jelzősíppal adott kettőnél több hosszú hanggal (▬ ▬ ▬ ▬……….)."
  },
  {
    "id": "tetel-53",
    "name": "Megállj! – tolatási kézi- és hangjelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászló vagy az egyik kar körbeforgatása a mozdonyvezető felé. Sötétben bármilyen fényű kézi jelzőlámpa körbeforgatása a mozdonyvezető felé. A látható jelzést szükség esetén ki kell egészíteni a jelzősíppal adott három rövid hanggal (●●●)."
  },
  {
    "id": "tetel-54",
    "name": "Gyorsíts! – tolatási kézijelzés",
    "definition": "A szükséges Közeledj felém! vagy Távolodj tőlem! jelzés látható részének gyors ütemben történő adása a mozdonyvezető felé."
  },
  {
    "id": "tetel-55",
    "name": "Nyomás! – tolatási kézijelzés",
    "definition": "A Közeledj felém! jelzés látható részének rövid mozdulatú adása a mozdonyvezető felé, a járművek szétkapcsolásának megkönnyítése érdekében. A jelzést a járműkapcsolás végrehajtása előtt a kapcsolandó járművek mellett állva kell adni."
  },
  {
    "id": "tetel-56",
    "name": "Határig! – tolatási kézijelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászlónak, sötétben fehér fényű kézi jelzőlámpának a föld közelében, vízszintes irányban, rövid mozdulatokkal jobbra-balra mozgatása, és ezután a szükséges Közeledj felém! vagy Távolodj tőlem! jelzés látható részének adása a mozdonyvezető felé."
  },
  {
    "id": "tetel-57",
    "name": "Rájár! – tolatási kézijelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászlónak, sötétben fehér fényű kézi jelzőlámpának lassú mozgatással félkör alakban a fej fölé vitele, és ott nyugodtan tartása, majd a szükséges Közeledj felém! vagy Távolodj tőlem! jelzés látható részének adása a mozdonyvezető felé."
  },
  {
    "id": "tetel-58",
    "name": "Szétkapcsolni! – tolatási kézijelzés",
    "definition": "Nappal kibontott sárga színű jelzőzászlónak, sötétben a fehér fényű kézi jelzőlámpának mellmagasságban, kisívben, gyors mozdulattal a törzstől kifelé lendítése."
  },
  {
    "id": "tetel-59",
    "name": "A tolatási kézi- és hangjelzések alkalmazása",
    "definition": "A tolatás közben alkalmazható kézijelzéseket mindig olyan helyen, űrszelvényen kívül (kivéve mozgó járműveken történő jelzésadáskor) állva vagy haladva kell adni, hogy azokat a mozdonyvezető vagy a mozdonyvezető mellett figyelőszolgálatot ellátó dolgozó kétséget kizáró módon láthassa. Ha a mozgó jármű mellett az űrszelvényen belül műtárgy vagy mobil berendezés van, a járműről kihajolni vagy kinyúlni még jelzésadás vagy jelzés megfigyelése céljából is tilos. Ha a mozdonyról, vezérlőkocsiról a tolatásvezető által adott kézijelzés nem látható, akkor azt a tolatószemélyzet jól látható helyről köteles a mozdonyvezető felé továbbítani. A mozdonyszemélyzettel a tolatás megkezdése előtt közölni kell, hogy a kézijelzéseket a pálya (vágány) melyik oldalán fogják adni. Veszély esetét kivéve a tolatásvezető és a mozdonyvezető között minden tolatás közben alkalmazható kézi- és hangjelzés mellőzhető, ha közöttük jól működő rádiókapcsolat van. A Megállj! jelzést mindenkor a tényleges megállásig kell adni. A Lassan! és a Gyorsíts! kézijelzéseket a kívánt sebesség eléréséig kell adni, majd folytatni kell az addig adott Távolodj tőlem! vagy Közeledj felém! jelzést, vagy Megállj! jelzést kell adni."
  }
]</script>
<script>
'use strict';
const CONCEPTS=JSON.parse(document.getElementById('concept-data').textContent);
const KEY='vasuti-szokirako:progress:v1';
const app=document.getElementById('app');
const homeButton=document.getElementById('home');
let storageUnavailable=false;
let progress=readProgress();
let session=null;
document.getElementById('concept-count').textContent=CONCEPTS.length;
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function warnStorage(){storageUnavailable=true;document.getElementById('storage-note').hidden=false;}
function readProgress(){
 const clean={version:1,concepts:{}};
 try{
  const raw=localStorage.getItem(KEY);if(!raw)return clean;
  const saved=JSON.parse(raw);
  if(saved?.version!==1||!saved.concepts||typeof saved.concepts!=='object'||Array.isArray(saved.concepts))throw Error('Invalid progress');
  for(const c of CONCEPTS){const p=saved.concepts[c.id];if(!p)continue;
   if(!['easy','medium','hard'].includes(p.difficulty)||!Number.isSafeInteger(p.completed)||p.completed<0)throw Error('Invalid record');
   clean.concepts[c.id]={difficulty:p.difficulty,completed:p.completed};
  }
 }catch{warnStorage();}
 return clean;
}
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch{warnStorage();}}
function record(id){return progress.concepts[id]||(progress.concepts[id]={difficulty:'medium',completed:0});}
function tokenize(definition){
 const words=[],pieces=[];let cursor=0;
 for(const m of definition.matchAll(/[\p{L}\p{M}\p{N}]+/gu)){
  if(m.index>cursor)pieces.push({text:definition.slice(cursor,m.index)});
  pieces.push({slot:words.length});words.push({id:words.length,text:m[0]});cursor=m.index+m[0].length;
 }
 if(cursor<definition.length)pieces.push({text:definition.slice(cursor)});
 return {words,pieces};
}
function shuffle(values){
 const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;
}
function chooseNextConcept(currentId=null){
 const weights=CONCEPTS.map(c=>({c,weight:({easy:1,medium:2,hard:4}[progress.concepts[c.id]?.difficulty||'medium'])*(c.id===currentId ? 0.35 : 1)}));
 let pick=Math.random()*weights.reduce((sum,x)=>sum+x.weight,0);
 for(const x of weights){pick-=x.weight;if(pick<0)return x.c;}return weights[weights.length-1].c;
}
function showHome(){
 session=null;homeButton.hidden=true;
 app.innerHTML='<h1>Rakd össze a fogalmat</h1><p class="intro">Koppints a szavakra a helyes sorrendben. A fenti szóra koppintva visszateheted a kupacba. Az írásjelek a helyükön maradnak.</p><div class="card"><p class="small">Minden szó felhasználása után ellenőrizhetsz. Helyes megoldással léphetsz tovább. A nehéznek értékelt fogalmak gyakrabban kerülnek elő.</p></div><button class="btn primary wide" id="start">Gyakorlás indítása</button>';
 document.getElementById('start').onclick=()=>startConcept(chooseNextConcept());
}
function startConcept(concept){
 const parsed=tokenize(concept.definition);
 session={concept,...parsed,pool:shuffle(parsed.words.map(w=>w.id)),slots:Array(parsed.words.length).fill(null),errors:new Set(),hasChecked:false,solved:false};
 homeButton.hidden=false;
 app.innerHTML='<p class="small">'+CONCEPTS.length+' fogalom · véletlen sorrend</p><h1 id="term-title">'+escapeHTML(concept.name)+'</h1><p class="small" style="margin-top:10px">Alul válassz szót. Felül koppints a visszavételhez.</p><section class="card answer-card" id="answer-card" aria-labelledby="term-title"><div class="between"><h2>A meghatározás</h2><span class="count" id="placed-count"></span></div><div class="sentence" id="sentence" aria-label="A fogalom összeállítása"></div></section><section class="card bank-card" id="bank-card"><div class="between"><h2>Szavak</h2><span class="count" id="remaining-count"></span></div><div class="bank" id="bank"></div></section><section id="result" class="card success-card" hidden><p class="feedback" id="feedback" role="status" aria-live="polite" tabindex="-1"></p><p class="rating-label">Mennyire volt nehéz?</p><div class="row" id="ratings">'+['easy','medium','hard'].map((grade,i)=>'<button class="btn rating" data-grade="'+grade+'" aria-pressed="false">'+['Könnyű','Közepes','Nehéz'][i]+'</button>').join('')+'</div><p class="small" style="margin-top:10px">A nehéz fogalom négyszeres súllyal kerül a sorsolásba.</p><div id="full-definition" hidden><h2 style="margin-top:20px">A teljes fogalom</h2><p class="definition">'+escapeHTML(concept.definition)+'</p></div></section><div class="actions"><div class="jump-row"><button class="quiet" id="jump-answer">Szöveg ↑</button><button class="quiet" id="jump-bank">Szavak ↑</button></div><div class="action-row"><button class="btn primary" id="check" disabled>Ellenőrzés</button><button class="btn" id="next" disabled>Következő</button></div></div>';
 document.getElementById('check').onclick=checkAnswer;
 document.getElementById('next').onclick=()=>{if(session?.solved)startConcept(chooseNextConcept(session.concept.id));};
 document.getElementById('jump-answer').onclick=()=>document.getElementById('answer-card').scrollIntoView({block:'start'});
 document.getElementById('jump-bank').onclick=()=>document.getElementById('bank-card').scrollIntoView({block:'start'});
 for(const b of document.getElementById('ratings').querySelectorAll('[data-grade]'))b.onclick=()=>gradeConcept(b.dataset.grade);
 renderWords();renderRating();document.getElementById('term-title').scrollIntoView({block:'start'});
}
function renderWords(){
 const used=new Set(session.slots.filter(id=>id!==null));
 const sentence=document.getElementById('sentence');
 sentence.innerHTML=session.pieces.map(piece=>{
  if('text' in piece)return '<span class="punct">'+escapeHTML(piece.text)+'</span>';
  const index=piece.slot,id=session.slots[index],word=id===null?'':(session.solved?session.words[index].text:session.words[id].text);
  const label=id===null?'Üres szóhely '+(index+1):word+' – vissza a szavak közé';
  return '<span class="piece"><button class="slot'+(id===null?' empty':'')+(session.errors.has(index)?' wrong':'')+(session.solved?' correct':'')+'" data-slot="'+index+'" aria-label="'+escapeHTML(label)+'" '+(id===null||session.solved?'disabled':'')+'>'+(id===null?(index+1):escapeHTML(word))+'</button></span>';
 }).join('');
 for(const b of sentence.querySelectorAll('[data-slot]'))b.onclick=()=>removeWord(Number(b.dataset.slot));
 const bank=document.getElementById('bank');
 bank.innerHTML=session.pool.map(id=>'<button class="word'+(used.has(id)?' used':'')+'" data-word="'+id+'" '+(used.has(id)||session.solved?'disabled':'')+' aria-label="'+escapeHTML(session.words[id].text+' – a következő üres helyre')+'">'+escapeHTML(session.words[id].text)+'</button>').join('');
 for(const b of bank.querySelectorAll('[data-word]'))b.onclick=()=>addWord(Number(b.dataset.word));
 const placed=used.size;
 document.getElementById('placed-count').textContent=placed+' / '+session.words.length+' szó';
 document.getElementById('remaining-count').textContent=(session.words.length-placed)+' maradt';
 document.getElementById('check').disabled=placed!==session.words.length||session.solved;
 document.getElementById('next').disabled=!session.solved;
}
function clearCheckFeedback(){session.errors.clear();if(session.hasChecked){document.getElementById('feedback').textContent='Javítás után ellenőrizz újra.';document.getElementById('feedback').className='feedback';}}
function addWord(id){
 if(!session||session.solved||!Number.isInteger(id)||id<0||id>=session.words.length||session.slots.includes(id))return;
 const next=session.slots.indexOf(null);if(next<0)return;
 session.slots[next]=id;clearCheckFeedback();renderWords();
}
function removeWord(index){
 if(!session||session.solved||!Number.isInteger(index)||index<0||index>=session.slots.length||session.slots[index]===null)return;
 session.slots[index]=null;clearCheckFeedback();renderWords();
}
function normalizeWord(word){return word.normalize('NFC').toLocaleLowerCase('hu');}
function checkAnswer(){
 if(!session||session.solved||session.slots.some(id=>id===null))return;
 session.hasChecked=true;session.errors.clear();
 session.slots.forEach((id,index)=>{if(normalizeWord(session.words[id].text)!==normalizeWord(session.words[index].text))session.errors.add(index);});
 session.solved=session.errors.size===0;
 if(session.solved){const p=record(session.concept.id);p.completed++;saveProgress();}
 renderWords();renderRating();
 const result=document.getElementById('result');result.hidden=false;
 const feedback=document.getElementById('feedback');feedback.className='feedback '+(session.solved?'good':'bad');
 feedback.textContent=session.solved?'Helyes! A fogalmat összeállítottad.':session.errors.size+' szó nincs a megfelelő helyen. A pirossal jelölt szavakat visszaveheted és javíthatod.';
 document.getElementById('full-definition').hidden=!session.solved;
 feedback.focus({preventScroll:true});
 if(session.solved)result.scrollIntoView({block:'start'});else document.getElementById('answer-card').scrollIntoView({block:'start'});
}
function renderRating(){const grade=progress.concepts[session.concept.id]?.difficulty;for(const b of document.getElementById('ratings').querySelectorAll('[data-grade]')){const selected=b.dataset.grade===grade;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));}}
function gradeConcept(grade){if(!session?.hasChecked||!['easy','medium','hard'].includes(grade))return;record(session.concept.id).difficulty=grade;saveProgress();renderRating();}
homeButton.onclick=showHome;
showHome();

</script>
</body>
</html>
